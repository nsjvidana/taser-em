[workspace]
members = ["crates/taser-em-shaders","crates/taser-em1d"]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Nilson Sampath J Vidanapatiranage <nilsonjvidana@gmail.com>"]
# TODO: repository = ""
categories = [
    "science",
    "simulation",
    "mathematics",
]
keywords = ["physics", "electromagnetics", "fdtd", "n-dimensional"]
# TODO: license = ""
# TODO: rust-version = ""
edition = "2024"

[workspace.dependencies]
khal = { version = "0.2.0", features = ["derive"] }
khal-builder = "0.2.0"
khal-std = "0.2.0"
glamx = { version = "0.3", features = ["bytemuck"] }
bytemuck = "1"
include_dir = "0.7"