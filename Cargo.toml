[workspace]
members = [
    "crates/taser-em1d",
    "crates/taser-em-shaders1d",
    "crates/taser-em-testbed1d",
    "examples1d",
    "crates/taser-em2d",
    "crates/taser-em-shaders2d",
    "crates/taser-em-testbed2d",
    "examples2d",
    "crates/taser-em3d",
    "crates/taser-em-shaders3d",
    "crates/taser-em-testbed3d",
    "examples3d",
    "crates/taser-em-macros",
]
resolver = "2"

[workspace.lints]
rust.unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("dim1", "dim2", "dim3", "cpu", "cuda", "cuda-oxide", "metal"))',
    'cfg(target_arch, values("spirv", "nvptx64"))',
    'cfg(target_arch_is_gpu)',
] }

[workspace.package]
version = "0.1.0"
authors = ["Nilson Sampath Jayasinghe Vidana Patiranage <nilsonjvidana@gmail.com>"]
repository = "https://github.com/nsjvidana/taser-em/"
categories = [
    "science",
    "simulation",
    "mathematics",
]
keywords = ["physics", "electromagnetics", "fdtd", "n-dimensional"]
license = "Apache-2.0"
edition = "2024"

[workspace.dependencies]
parry3d = "0.28"
khal = { version = "0.4.0", features = ["derive"] }
khal-builder = "0.4.0"
khal-std = "0.4.0"
spirv-std = { version = "0.10.0", features = ["default"] }
kiss3d = { version = "0.47.0", features = ["egui"] }
egui_plot = "0.37"
glamx = { version = "0.3", features = ["bytemuck"] }
num-complex = { version = "0.4.6", default-features = false, features = ["bytemuck", "libm"] }
mesh-loader = { version = "0.1.13", features = ["stl", "collada", "obj"] }
ndarray = "0.17.2"
bitflags = { version = "2.13.0", default-features = false, features = ["bytemuck"] }
bytemuck = "1"
itertools = "0.15"
include_dir = "0.7"
thiserror = { version = "2", default-features = false, features = ["std"] }
derive_more = { version = "2", default-features = false, features = ["full"] }
derivative = "2"
anyhow = "1"
rayon = "1.1"

# Internal crates
taser-em1d = { version = "0.1.0", path = "crates/taser-em1d" }
taser-em-shaders1d = { version = "0.1.0", path = "crates/taser-em-shaders1d" }
taser-em-testbed1d = { version = "0.1.0", path = "crates/taser-em-testbed1d" }
taser-em2d = { version = "0.1.0", path = "crates/taser-em2d" }
taser-em-shaders2d = { version = "0.1.0", path = "crates/taser-em-shaders2d" }
taser-em-testbed2d = { version = "0.1.0", path = "crates/taser-em-testbed2d" }
taser-em3d = { version = "0.1.0", path = "crates/taser-em3d" }
taser-em-shaders3d = { version = "0.1.0", path = "crates/taser-em-shaders3d" }
taser-em-testbed3d = { version = "0.1.0", path = "crates/taser-em-testbed3d" }
taser-em-macros = { version = "0.1.0", path = "crates/taser-em-macros" }

# Compile build dependencies to speed up shader compilation times
[profile.release.build-override]
opt-level = 3
codegen-units = 16
[profile.dev.build-override]
opt-level = 3

# Fix by @lucasmerlin for access violation crash on old Vulkan drivers.
# PR #10124 (https://github.com/gfx-rs/wgpu/pull/10124)
[patch.crates-io]
wgpu-hal = { git = "https://github.com/nsjvidana/wgpu.git", branch = "lucasmerlin-old-vk-fix" }
wgpu = { git = "https://github.com/nsjvidana/wgpu.git", branch = "lucasmerlin-old-vk-fix" }