[package]
name = "examples1d"
version.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
edition.workspace = true

[features]
default = ["webgpu"]
unsafe_remove_boundchecks = ["taser-em1d/unsafe_remove_boundchecks"]
#rayon = ["taser-em1d/rayon", "taser-em-testbed1d/rayon"]
rayon = ["taser-em1d/rayon"] # Testbed rayon is broken at the moment
webgpu = ["taser-em1d/webgpu"]
metal = ["taser-em1d/metal"]
cpu = ["taser-em1d/cpu"]
cpu-parallel = ["cpu", "taser-em1d/cpu-parallel"]
cuda = ["taser-em1d/cuda"]

[dependencies]
taser-em-testbed1d.workspace = true
kiss3d.workspace = true

[dependencies.taser-em1d]
path = "../crates/taser-em1d"
default-features = false

[[bin]]
name = "examples1d"
path = "main.rs"