[package]
name = "taser-em-shaders3d"
version.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
edition.workspace = true
links = "taser-em-shaders3d"

[lints]
rust.unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("dim1", "dim2"))',
    'cfg(target_arch, values("spirv"))',
] }

[features]
default = ["dim3"]
dim3 = []
unsafe_remove_boundchecks = ["khal-std/unsafe_remove_boundchecks"]
cpu = ["khal-std/cpu", "khal/cpu"]
cpu-parallel = ["cpu", "khal-std/cpu-parallel"]
cuda = ["khal-std/cuda"]

[lib]
name = "taser_em_shaders3d"
path = "../../src_shaders/src/lib.rs"
required-features = ["dim3"]

[dependencies]
khal-std.workspace = true
bytemuck.workspace = true

[target.'cfg(target_arch = "spirv")'.dependencies]
spirv-std.workspace = true

[target.'cfg(not(any(target_arch = "spirv", target_arch = "nvptx64")))'.dependencies]
khal.workspace = true

[build-dependencies]
khal-std.workspace = true