[package]
name = "taser-em-testbed3d"
version.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
edition.workspace = true

[lints]
rust.unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("dim1", "dim2"))',
    'cfg(target_arch, values("spirv"))',
] }

[features]
default = ["dim3"]
dim3 = []
rayon = ["dep:rayon"] # rayon breaks the visualizer for some reason...

[lib]
name = "taser_em_testbed3d"
path = "../../src_testbed/src/lib.rs"
required-features = ["dim3"]

[dependencies]
kiss3d.workspace = true
khal.workspace = true
rayon = { workspace = true, optional = true }
glamx.workspace = true
anyhow.workspace = true

[dependencies.taser_em]
package = "taser-em3d"
path = "../taser-em3d"
version = "0.1.0"