[package]
name = "taser-em-testbed1d"
version.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
edition.workspace = true

[lints]
rust.unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("dim2", "dim3"))',
    'cfg(target_arch, values("spirv"))',
] }

[features]
default = ["dim1"]
dim1 = []
rayon = ["dep:rayon"] # rayon breaks the visualizer for some reason...

[lib]
name = "taser_em_testbed1d"
path = "../../src_testbed/src/lib.rs"
required-features = ["dim1"]

[dependencies]
kiss3d.workspace = true
khal.workspace = true
rayon = { workspace = true, optional = true }
glamx.workspace = true
anyhow.workspace = true

[dependencies.taser_em]
package = "taser-em1d"
path = "../taser-em1d"
version = "0.1.0"