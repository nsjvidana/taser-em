[package]
name = "taser-em-shaders2d"
version.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
edition.workspace = true
links = "taser-em-shaders2d"
build = "../build.rs"

[features]
default = ["dim2"]
dim2 = []
cpu = ["khal-std/cpu"]
cpu-parallel = ["khal-std/cpu-parallel"]
cuda = ["khal-std/cuda"]

[lib]
name = "taser_em_shaders2d"
path = "../src/lib.rs"
required-features = ["dim2"]

[dependencies]
khal-std.workspace = true
bytemuck.workspace = true

[target.'cfg(not(any(target_arch = "spirv", target_arch = "nvptx64")))'.dependencies]
khal.workspace = true

[build-dependencies]
khal-std.workspace = true
taser-em-build = { path = "../../taser-em-build" }